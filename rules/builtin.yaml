# LeakGoose 内置规则包（凭据向 + 中国个保法 PII 向）
# 语法：regexp2（.NET 风格，支持前后瞻断言）；路径通配支持 ** 与 *。
# PII 类规则一律配 validate 验真函数（校验位/号段/Luhn），把误报压到可用的水平。
rules:
  # ============ 云厂商与平台凭据 ============
  - id: aliyun-access-key-id
    name: 阿里云 AccessKeyId
    severity: critical
    pattern: 'LTAI[0-9A-Za-z]{12,20}'

  - id: tencent-secret-id
    name: 腾讯云 SecretId
    severity: critical
    pattern: 'AKID[0-9A-Za-z]{13,40}'

  - id: aws-access-key-id
    name: AWS Access Key ID
    severity: critical
    pattern: '(?:A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z0-9]{16}'

  - id: github-token
    name: GitHub Token（经典/细粒度 PAT、OAuth、刷新令牌）
    severity: critical
    pattern: '(?:gh[pousr]_|github_pat_)[A-Za-z0-9_]{20,}'

  - id: gitlab-pat
    name: GitLab 个人访问令牌
    severity: critical
    pattern: 'glpat-[A-Za-z0-9_-]{20,}'

  - id: slack-token
    name: Slack Token
    severity: critical
    pattern: 'xox[baprs]-[A-Za-z0-9-]{10,}'

  - id: google-api-key
    name: Google API Key
    severity: critical
    pattern: 'AIza[0-9A-Za-z_-]{35}'

  - id: npm-token
    name: npm 访问令牌
    severity: critical
    pattern: 'npm_[A-Za-z0-9]{36}'

  # ============ 通用凭据形态 ============
  - id: private-key-block
    name: 私钥文件块（PEM 头）
    severity: critical
    pattern: '-----BEGIN [A-Z ]*PRIVATE KEY-----'

  - id: url-embedded-credentials
    name: URL 内嵌账号口令（scheme://user:pass@host）
    severity: critical
    pattern: '\b[a-z][a-z0-9+.-]{1,20}://[^\s:/@''"=]+:[^\s/@''"]{4,}@'

  - id: password-assignment
    name: 配置中的口令赋值（password/secret/api_key/token = 字面量）
    severity: medium
    pattern: '(?i)(?:password|passwd|pwd|secret|api[_-]?key|access[_-]?key|token)[''\"]?\s*[:=]\s*[''\"](?![^''\"]*(?:secret|password|passwd|token|key))[^''\"\s]{8,}[''\"]'

  - id: jwt-token
    name: JWT（三段式；含公开 id_token，人审判断）
    severity: medium
    pattern: 'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'

  # ============ 中国个保法 PII（配验真降误报） ============
  - id: cn-id-card
    name: 中国居民身份证号（18 位，校验位验真）
    severity: critical
    pattern: '(?<![0-9Xx])[1-8]\d{5}(?:18|19|20)\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\d|3[01])\d{3}[0-9Xx](?![0-9Xx])'
    validate: builtin:id-card-checksum

  - id: cn-mobile
    name: 中国大陆手机号（11 位，号段验真）
    severity: high
    pattern: '(?<!\d)1[3-9]\d{9}(?!\d)'
    validate: builtin:cn-mobile-segment

  - id: cn-bank-card
    name: 银行卡号（16/19 位，Luhn 验真）
    severity: high
    pattern: '(?<!\d)(?:\d{16}|\d{19})(?!\d)'
    validate: builtin:luhn
