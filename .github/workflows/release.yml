name: Release

on:
  push:
    tags: ['v*']

# 发版需要写 Release：GITHUB_TOKEN 最小必要写权限（无 PAT 依赖）
permissions:
  contents: write

jobs:
  release:
    name: 构建 6 平台二进制并发布
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      # 规则中心 UI 先于 go build 构建：//go:embed all:web/dist 内嵌真实产物
      # （仓库里只提交最小占位 index.html，CI/Release 在线构建完整 dist）
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 构建规则中心 Web UI
        run: |
          cd web
          npm ci
          npm run build
          ls dist/assets | head -3
      - name: 版本一致性断言（tag ↔ --version 注入）
        run: |
          VER="${GITHUB_REF_NAME#v}"
          case "$VER" in *-*) echo "::error::tag 携带预发布后缀以外内容，请检查"; exit 1;; esac
          echo "VER=$VER" >> "$GITHUB_ENV"
      - name: 交叉编译（linux/darwin/windows × amd64/arm64）
        run: |
          mkdir -p dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              name="leakgoose_${VER}_${os}_${arch}"
              GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build \
                -trimpath -ldflags "-s -w -X main.version=${VER}" \
                -o "dist/leakgoose" .
              if [ "$os" = "windows" ]; then
                mv dist/leakgoose "dist/leakgoose.exe"
                (cd dist && zip -q "${name}.zip" leakgoose.exe && rm leakgoose.exe)
              else
                tar -czf "dist/${name}.tar.gz" -C dist leakgoose && rm dist/leakgoose
              fi
            done
          done
          (cd dist && sha256sum * > checksums.txt)
          ls -la dist/
      - name: 冒烟验证（linux/amd64 二进制真实跑一遍规则加载）
        run: |
          tar -xzf "dist/leakgoose_${VER}_linux_amd64.tar.gz" -C /tmp
          /tmp/leakgoose version
          /tmp/leakgoose rules | grep -q "共 15 条规则"
      - name: 冒烟验证（规则中心：嵌入 UI 可达 + pack API 鉴权生效）
        run: |
          /tmp/leakgoose center serve -listen 127.0.0.1:8299 -db /tmp/center-smoke.db > /tmp/center.log 2>&1 &
          sleep 1
          # 嵌入的是真实构建产物：HTML 引用带 hash 的资源，且能取到该 JS
          html="$(curl -fsSL http://127.0.0.1:8299/login)"
          echo "$html" | grep -qo '/assets/index-[^"]*\.js' || { echo "UI 未嵌入真实产物"; exit 1; }
          asset="$(echo "$html" | grep -o '/assets/index-[^"]*\.js' | head -1)"
          curl -fsSL "http://127.0.0.1:8299$asset" > /dev/null
          # pack 接口未带令牌必须 401（鉴权在、不是裸奔）
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8299/api/packs/latest)"
          [ "$code" = "401" ] || { echo "pack API 期望 401 实得 $code"; exit 1; }
          kill %1
          cat /tmp/center.log
      - name: 创建 Release 并上传构件（幂等：已存在则复用）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 幂等：Release 已存在（失败重跑）则复用；--clobber 覆盖同名附件
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "LeakGoose ${GITHUB_REF_NAME}" \
                 --generate-notes --repo "$GITHUB_REPOSITORY"
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
